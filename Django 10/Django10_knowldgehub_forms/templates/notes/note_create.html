{% extends 'base.html' %}

{% block title %}

{% endblock %}

{% block content %}
	<form method="POST" class="note-form">
            <span class="eyebrow">Create</span>
            <h1>New note</h1>

            <p>
                <label>Title:</label>
                <p>
                    <input name="title" required>
                </p>
            </p>
            <p>
                <label>Text:</label>
                <p>
                    <textarea name="body" rows=4></textarea>
                </p>
            </p>

            <p>
                <label>Tag:</label>
                <p>
                    <input name="tag">
                </p>
            </p>
            <p>
                <label>Category:</label>
                <p>
                    <input name="category">
                </p>
            </p>

             <p>
                <button type="submit">Create</button>
            </p>
        </form>
{% endblock %}
