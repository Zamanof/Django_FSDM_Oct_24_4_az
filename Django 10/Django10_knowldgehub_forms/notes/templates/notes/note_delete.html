{% extends 'base.html' %}


{% block content %}
	<span class="eyebrow">Confirmation</span>
    <h1>Delete Note?</h1>
  <p></p>
  <form method="post" class="danger-card">
    {% csrf_token %}
    <button class="danger-button" type="submit">Yes, delete</button>
    <a class="muted" href="{% url 'notes:notes_list' %}">Cancel</a>
  </form>
{% endblock %}
