{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Knowledge Hub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" href="{% static 'images/favicon.ico' %}?v=1" sizes="any">
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}?v=1">
    <style>
        :root {
            --ink: #1f2937;
            --ink-soft: #374151;
            --muted: #6b7280;
            --border: #e5e7eb;
            --surface: #f7f7f5;
            --paper: #ffffff;
            --accent: #0f766e;
            --accent-hover: #0d9488;
            --accent-soft: #f0fdfa;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 15.5px;
            line-height: 1.65;
            color: var(--ink);
            background: var(--surface);
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            color: var(--accent-hover);
        }

        .site-shell {
            width: min(1120px, calc(100% - 2rem));
            margin-inline: auto;
        }

        .site-nav .navbar-inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            min-height: 58px;
        }

        @media (min-width: 768px) {
            .site-nav .navbar-collapse {
                flex-grow: 1;
            }
        }

        .reading-width {
            max-width: 820px;
        }

        .narrow-width {
            max-width: 420px;
        }

        .form-width {
            max-width: 560px;
        }

        .site-nav {
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
            padding-top: 14px;
            padding-bottom: 14px;
        }

        .site-nav .navbar-brand.brand-lockup {
            display: inline-flex;
            align-items: center;
            gap: 0;
            color: var(--ink);
            text-decoration: none;
            line-height: 1;
            padding: 0;
        }

        .site-nav .navbar-brand.brand-lockup:hover {
            color: var(--ink);
        }

        .site-nav .navbar-brand.brand-lockup:hover .brand-name {
            color: var(--accent);
        }

        .brand-logo {
            width: auto;
            height: 54px;
            max-width: 70px;
            object-fit: contain;
            object-position: center;
            flex-shrink: 0;
            display: block;
            background: transparent;
            margin-right: 13px;
        }

        .brand-divider {
            display: none;
            width: 1px;
            height: 45px;
            background: #cbd5e1;
            flex-shrink: 0;
            align-self: center;
            margin-right: 16px;
        }

        @media (min-width: 400px) {
            .brand-divider {
                display: block;
            }
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            min-width: 0;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #1a202c;
            line-height: 1.08;
        }

        .brand-tagline {
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 0.19em;
            text-transform: uppercase;
            color: #8b97a8;
            line-height: 1;
            white-space: nowrap;
            padding-left: 2px;
        }

        .site-nav .nav-link {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.35rem 0.65rem !important;
            border-radius: 6px;
        }

        .site-nav .nav-link:hover,
        .site-nav .nav-link.active {
            color: var(--ink);
            background: transparent;
        }

        .site-nav .nav-link.active {
            box-shadow: inset 0 -2px 0 var(--accent);
            border-radius: 0;
        }

        .page-kicker {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .page-heading {
            margin: 0 0 0.75rem;
            color: var(--ink);
            font-size: clamp(1.55rem, 2.4vw, 1.9rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.25;
        }

        .page-lede {
            max-width: 42rem;
            margin: 0;
            color: var(--muted);
            font-size: 1.02rem;
            line-height: 1.7;
        }

        .note-list {
            margin: 0;
            padding: 0;
            list-style: none;
            border-top: 1px solid var(--border);
        }

        .note-item {
            padding: 1.35rem 0.15rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s ease;
        }

        .note-item:hover {
            background: rgba(15, 118, 110, 0.03);
        }

        .note-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.35rem 0.55rem;
            margin-bottom: 0.45rem;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .note-meta .dot {
            color: #d1d5db;
        }

        .note-title {
            display: inline-block;
            margin: 0 0 0.35rem;
            color: var(--ink);
            font-size: 1.12rem;
            font-weight: 650;
            letter-spacing: -0.02em;
            line-height: 1.35;
            text-decoration: none;
        }

        .note-item:hover .note-title {
            color: var(--accent);
        }

        .note-preview {
            margin: 0 0 0.7rem;
            color: var(--ink-soft);
            font-size: 0.95rem;
            line-height: 1.65;
        }

        .note-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .category-label {
            display: inline-block;
            padding: 0.12rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: #fff;
            color: var(--ink-soft);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .tag {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 500;
        }

        .note-content {
            margin-top: 1.5rem;
            color: var(--ink-soft);
            font-size: 1.02rem;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        .form-shell {
            padding: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--paper);
        }

        .form-shell label,
        .form-shell .form-label {
            margin-bottom: 0.35rem;
            color: var(--ink-soft);
            font-size: 0.88rem;
            font-weight: 600;
        }

        .form-shell .form-control,
        .form-shell .form-select,
        .form-shell input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]),
        .form-shell select,
        .form-shell textarea {
            border-color: #d1d5db;
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
            font-size: 0.95rem;
        }

        .form-shell .form-control:focus,
        .form-shell .form-select:focus,
        .form-shell input:focus,
        .form-shell select:focus,
        .form-shell textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
        }

        .form-shell p {
            margin-bottom: 1rem;
        }

        .form-shell p:last-of-type {
            margin-bottom: 0;
        }

        .btn-accent {
            border: 0;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }

        .btn-accent:hover,
        .btn-accent:focus {
            background: var(--accent-hover);
            color: #fff;
        }

        .btn-quiet {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--ink-soft);
            font-weight: 500;
        }

        .btn-quiet:hover {
            background: var(--surface);
            color: var(--ink);
            border-color: #d1d5db;
        }

        .link-back {
            color: var(--muted);
            font-size: 0.88rem;
        }

        .link-back:hover {
            color: var(--accent);
        }

        .home-shortcuts a {
            display: inline-flex;
            align-items: center;
            padding: 0.55rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--ink-soft);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .home-shortcuts a:hover {
            border-color: #cbd5e1;
            color: var(--accent);
            background: var(--accent-soft);
        }

        .empty-state {
            padding: 2.5rem 1rem;
            border: 1px dashed var(--border);
            border-radius: 10px;
            background: #fff;
            text-align: center;
        }

        code {
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            background: #eef2f7;
            color: var(--ink-soft);
            font-size: 0.9em;
        }
    </style>
</head>
<body>
{% include 'notes/_page_header.html' %}
<main class="site-shell py-4 py-md-5">
    {% block content %}

    {% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
