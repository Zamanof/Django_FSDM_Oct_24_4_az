{% extends 'base.html' %}
{% load static %}

{% block title %}
    Register - Knowledge Hub
{% endblock %}

{% block content %}
<div class="narrow-width mx-auto">
    <span class="page-kicker">Account</span>
    <h1 class="page-heading">Create account</h1>
    <p class="page-lede mb-4">Register to start collecting notes.</p>

    <form method="post" class="form-shell" autocomplete="off">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-accent w-100 mt-2" type="submit">Register</button>
    </form>

    <p class="text-secondary small mt-3 mb-0">
        Already registered?
        <a href="{% url 'accounts:login' %}">Sign in</a>
    </p>
</div>
{% endblock %}
